<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Catch My Moon</title>
  <meta name="theme-color" content="#0b1020" />
  <style>
    :root {
      --bg:#0b1020;
      --fg:#e6f0ff;
      --accent:#7aa2ff;
      --win:#d6f5ff;
    }
    html,body{height:100%;margin:0;overflow:hidden;touch-action:none;user-select:none;background:radial-gradient(1200px 800px at 70% -10%, #1a2246 0%, transparent 60%),radial-gradient(900px 600px at 20% 0%, #0f1838 0%, transparent 70%),var(--bg);font-family:system-ui, sans-serif;color:var(--fg)}
    #game{position:fixed;inset:0;display:block;width:100vw;height:100vh}
    .hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
    .pill{background:rgba(255,255,255,.08);backdrop-filter:blur(6px);padding:8px 12px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.35);font-weight:600;letter-spacing:.3px}
    .controls{position:fixed;bottom:10px;left:0;right:0;display:flex;gap:10px;justify-content:center}
    .btn{appearance:none;border:none;border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.10);color:var(--fg);font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,16,.65);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s ease}
    .overlay.show{opacity:1;pointer-events:auto}
    .card{max-width:min(560px,90vw);margin:24px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .title{font-size:clamp(20px,4vw,28px);font-weight:800;margin:0 0 8px}
    .sub{opacity:.9;margin:0 0 16px}
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="pill" id="score">🌙 0 / 18</div>
  </div>

  <div class="controls">
    <button class="btn" id="startBtn">Start</button>
    <button class="btn" id="musicBtn">Music: Off</button>
    <button class="btn" id="tiltBtn">Enable Tilt</button>
  </div>

  <div class="overlay show" id="intro">
    <div class="card">
      <h2 class="title">Catch My Moon 🌙</h2>
      <p class="sub">Move the tiny 🚀 to catch falling moons.<br/>Drag with your finger — or enable tilt.</p>
      <div><button class="btn" id="playIntro">Tap to Play</button></div>
    </div>
  </div>

  <div class="overlay" id="win">
    <div class="card">
      <h2 class="title">I love you to the moon and back! 💖</h2>
      <p class="sub">You caught all the moons!</p>
      <div><button class="btn" id="replay">Play Again</button></div>
    </div>
  </div>

  <script>
  (()=>{
    const TARGET=18;const BASE_FALL=120;const FALL_INC=4;const MAX_MOONS=6;const MOON_SPAWN=800;
    const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
    function resize(){W=canvas.width=Math.floor(innerWidth*DPR);H=canvas.height=Math.floor(innerHeight*DPR);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';}addEventListener('resize',resize,{passive:true});resize();
    const input={dx:0,x:null,usingTilt:false};let lastTouchX=null;
    canvas.addEventListener('pointerdown',e=>{lastTouchX=e.clientX;input.x=e.clientX;});
    canvas.addEventListener('pointermove',e=>{if(lastTouchX!==null){input.x=e.clientX;}});
    addEventListener('pointerup',()=>{lastTouchX=null;});
    async function enableTilt(){try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){const res=await DeviceMotionEvent.requestPermission();if(res!=='granted')return false;}input.usingTilt=true;return true;}catch{return false;}}
    addEventListener('deviceorientation',e=>{if(!input.usingTilt)return;const g=Math.max(-30,Math.min(30,e.gamma||0));input.dx=g/30;});

    // simple improved background music (gentle melody)
    let AC=null,gainMain=null,melodyTimer=0;let playing=false;
    function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();gainMain=AC.createGain();gainMain.gain.value=0;gainMain.connect(AC.destination);}
    function musicOn(){initAudio();if(AC.state==='suspended')AC.resume();playing=true;gainMain.gain.linearRampToValueAtTime(0.1,AC.currentTime+0.5);melodyTimer=setInterval(()=>{const o=AC.createOscillator();const g=AC.createGain();o.type='sine';o.frequency.value=[392,440,494,523][Math.floor(Math.random()*4)];g.gain.setValueAtTime(0.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.5);o.connect(g);g.connect(gainMain);o.start();o.stop(AC.currentTime+0.5);},600);}
    function musicOff(){if(!AC)return;playing=false;gainMain.gain.linearRampToValueAtTime(0.0001,AC.currentTime+0.3);clearInterval(melodyTimer);}

    const ship={x:0,y:0,r:18,vx:0};const moons=[];const stars=createStars();let score=0,running=false,last=performance.now(),fallSpeed=BASE_FALL;
    function createStars(){const arr=[];const n=Math.floor((innerWidth*innerHeight)/9000);for(let i=0;i<n;i++){arr.push({x:Math.random(),y:Math.random(),tw:Math.random()*1,p:Math.random()*Math.PI*2});}return arr;}
    function spawnMoon(){if(moons.length>=MAX_MOONS)return;const r=12+Math.random()*10;moons.push({x:Math.random()*W,y:-30,r,vy:fallSpeed*(0.8+Math.random()*0.4),rot:Math.random()*Math.PI*2,vr:(Math.random()*0.6-0.3)});}

    function drawStars(dt){ctx.save();for(const s of stars){const x=s.x*W,y=s.y*H;const size=1.5*DPR;s.p+=dt*0.8*(0.5+s.tw);const a=0.6+0.4*Math.sin(s.p);ctx.globalAlpha=a*0.9;ctx.fillStyle='#b7c8ff';ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();}ctx.restore();}
    function drawMoon(m){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);const R=m.r;ctx.fillStyle='#ffe47a';ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(R*0.35,0,R*0.95,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=Math.max(1,R*0.12);ctx.beginPath();ctx.arc(0,0,R*0.98,-1.2,1.2);ctx.stroke();ctx.restore();}
    function drawShip(){ctx.save();ctx.translate(ship.x,ship.y);ctx.font=(ship.r*2.2)+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚀',0,0);ctx.restore();}
    function circleHit(ax,ay,ar,bx,by,br){const dx=ax-bx,dy=ay-by;return(dx*dx+dy*dy)<=(ar+br)*(ar+br);}

    let spawnTimer=0;const scoreEl=document.getElementById('score');function reset(){score=0;moons.length=0;fallSpeed=BASE_FALL;spawnTimer=0;running=true;ship.x=W*0.5;ship.y=H-80*DPR;ship.vx=0;input.dx=0;input.x=null;scoreEl.textContent=`🌙 ${score} / ${TARGET}`;document.getElementById('win').classList.remove('show');}
    function tick(now){const dt=Math.min(48,now-last)/1000;last=now;if(!running){requestAnimationFrame(tick);return render(0);}if(input.x!=null){const target=input.x*DPR;ship.vx+=(target-ship.x)*6*dt;}ship.vx+=input.dx*580*DPR*dt;ship.vx*=0.9;ship.x+=ship.vx*dt;ship.x=Math.max(ship.r*1.2,Math.min(W-ship.r*1.2,ship.x));spawnTimer-=dt*1000;if(spawnTimer<=0){spawnMoon();spawnTimer=MOON_SPAWN*(0.7+Math.random()*0.8);}for(let i=moons.length-1;i>=0;i--){const m=moons[i];m.y+=m.vy*dt;m.rot+=m.vr*dt;if(m.y>H+40){moons.splice(i,1);continue;}if(circleHit(ship.x,ship.y,ship.r*0.9,m.x,m.y,m.r*0.8)){moons.splice(i,1);score++;scoreEl.textContent=`🌙 ${score} / ${TARGET}`;fallSpeed+=FALL_INC;if(score>=TARGET){win();break;}}}render(dt);requestAnimationFrame(tick);}
    function render(dt){ctx.clearRect(0,0,W,H);drawStars(dt||0.016);for(const m of moons){drawMoon(m);}drawShip();}
    function win(){running=false;document.getElementById('win').classList.add('show');}

    document.getElementById('startBtn').onclick=()=>{begin(false)};
    document.getElementById('musicBtn').onclick=()=>{if(!playing){musicOn();document.getElementById('musicBtn').textContent='Music: On';}else{musicOff();document.getElementById('musicBtn').textContent='Music: Off';}};
    document.getElementById('tiltBtn').onclick=async()=>{const ok=await enableTilt();document.getElementById('tiltBtn').textContent=ok?'Tilt: On':'Tilt Unavailable';};
    document.getElementById('playIntro').onclick=()=>{begin(false)};
    document.getElementById('replay').onclick=()=>{begin(playing)};

    function begin(withMusic=false){reset();document.getElementById('intro').classList.remove('show');if(withMusic){musicOn();document.getElementById('musicBtn').textContent='Music: On';}last=performance.now();requestAnimationFrame(tick);}

    ship.x=W*0.5;ship.y=H-80*DPR;render(0);
  })();
  </script>
</body>
</html>
